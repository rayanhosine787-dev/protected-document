<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Protected Document Viewer</title>
<style>
html,body{margin:0;height:100%;background:#202124;font-family:Arial,sans-serif;overflow:hidden}
#bar{height:48px;background:#111;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;box-sizing:border-box}
#viewer{height:calc(100vh - 48px);width:100%;border:0;background:#fff}
#wm{position:fixed;right:14px;bottom:10px;color:rgba(255,255,255,.45);font-size:12px;z-index:3;pointer-events:none}
button{background:#333;color:#fff;border:1px solid #555;border-radius:6px;padding:7px 11px}
</style>
</head>
<body oncontextmenu="return false">
<div id="bar">
  <div>Protected Document</div>
  <div><button onclick="window.close()">Close</button></div>
</div>
<iframe id="viewer" src="document.pdf#toolbar=0&navpanes=0&scrollbar=1"></iframe>
<div id="wm">Viewing copy • Download/print controls hidden</div>
<script>
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&['s','p','u'].includes(e.key.toLowerCase())) e.preventDefault();
  if(e.key==='F12') e.preventDefault();
});
</script>
</body>
</html>
